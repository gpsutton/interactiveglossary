<!doctype html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nervous System Glossary</title>
  <meta name="description" content="An interactive, editable glossary of nervous system terms for biology students." />
  <meta name="theme-color" content="#FFFFFF" />

  <!-- Applies a saved theme preference before first paint, avoiding a flash
       of the wrong theme. Light mode is the default when nothing is saved. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("nervous-glossary:theme");
        if (saved === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      } catch (e) {
        /* storage unavailable — light mode default already set in the html tag */
      }
    })();
  </script>

  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet"
  />

  <!-- Tabler provides the base UI framework (buttons, forms, layout) -->
  <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" rel="stylesheet" />

  <!-- Our own styles layer on top: palette, keyframes, glossary-specific rules -->
  <link rel="stylesheet" href="./src/styles/app.css" />

  <!-- Zero build: third party packages resolved via import map, see src/modules/deps.mjs -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js",
        "goober": "https://unpkg.com/goober@2/dist/goober.esm.js"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/index.mjs"></script>
</body>
</html>
